[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptyv-loop"
version = "0.1.0"
description = "A budgeted design-test-learn loop over the Adaptyv Foundry API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[tool.setuptools]
packages = ["adaptyv_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
